{% extends "ordenes/base.html" %}
{% block content %}
<h1 class="h4">{% if editando %}Editar detalle{% else %}Agregar detalle{% endif %} - Orden #{{ orden_id }}</h1>
<form method="post" class="card card-body" style="max-width:520px">
  {% csrf_token %}
  <label class="form-label">Producto</label>
  <input class="form-control mb-3" name="producto" value="{{ detalle.producto|default:'' }}" required>
  <label class="form-label">Cantidad</label>
  <input class="form-control mb-3" type="number" min="1" step="1" name="cantidad" value="{{ detalle.cantidad|default:'' }}" required>
  <label class="form-label">Precio unitario (L)</label>
  <input class="form-control mb-3" type="number" min="0" step="0.01" name="precio_unitario" value="{{ detalle.precio_unitario|default:'' }}" required>
  <div><button class="btn btn-primary">Guardar</button>
  <a class="btn btn-link" href="{% url 'orden_ver' orden_id %}">Cancelar</a></div>
</form>
{% endblock %}
